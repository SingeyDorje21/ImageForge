# Builds the API and worker images and pushes them to Artifact Registry.
# Run from the repo root:
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO=imageforge .
substitutions:
  _REGION: us-central1
  _REPO: imageforge
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${_TAG}",
           "-f", "backend/Dockerfile.api", "backend"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/worker:${_TAG}",
           "-f", "Dockerfile.worker", "."]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/worker:${_TAG}
